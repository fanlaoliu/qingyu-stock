name: Update official EOD snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python scripts
        run: python -m py_compile scripts/update_data.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch official snapshots
        run: python scripts/update_data.py
      - name: Fetch official institutional flows
        continue-on-error: true
        run: python scripts/update_chips.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stocks.json
          if [ -f data/chips.json ]; then git add data/chips.json; fi
          git diff --cached --quiet || (git commit -m 'Update official EOD snapshots' && git push)

