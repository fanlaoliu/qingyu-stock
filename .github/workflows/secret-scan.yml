name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned scanner
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0
      - name: Scan tracked files (including proposed PR changes)
        shell: bash
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)(data/stocks\.json|data/chips\.json)$' > "$RUNNER_TEMP/secret-results.json"
          python - "$RUNNER_TEMP/secret-results.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              results = json.load(f).get("results", {})
          count = sum(len(items) for items in results.values())
          print(f"Potential secrets found: {count}")
          if count:
              print("Review locally; do not print secret values in CI logs.")
              sys.exit(1)
          PY
